php_version: "8.5"
node_version: "26"
framework: laravel
framework_version: "13"
secured: true
services:
  - mailpit
  - postgres
  - redis
workers:
  - backups
  - chat
  - notifications
  - queue
  - reverb
  - schedule
  - vite
custom_workers:
  backups:
    label: Backup operations
    command: php artisan queue:work backups --queue=backups --tries=1 --timeout=1800 --sleep=3
    restart: always
    check:
      file: app/Jobs/CreateSystemBackup.php
  chat:
    label: Chat broadcasts
    command: php artisan queue:work realtime --queue=chat --tries=3 --timeout=60 --sleep=1
    restart: always
    check:
      file: app/Events/ChatMessageCreated.php
  notifications:
    label: Realtime notifications
    command: php artisan queue:work realtime --queue=notifications --tries=3 --timeout=60 --sleep=1
    check:
      file: app/Events/NotificationRead.php
