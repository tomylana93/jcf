name: tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false)

    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: app_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d app_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_URL: ''

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BACKUP_INTEGRATION: '1'
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pgsql, zip
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.10.1
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php85-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php85-composer-

      - name: Install PHP dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Prepare PostgreSQL backup tools
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg-tools"
          printf '#!/bin/sh\nexec docker exec -i -e PGDATABASE %s pg_dump "$@"\n' "$POSTGRES_CONTAINER" > "$RUNNER_TEMP/pg-tools/pg_dump"
          printf '#!/bin/sh\nexec docker exec -i -e PGPASSWORD -e PGSSLMODE %s psql "$@"\n' "$POSTGRES_CONTAINER" > "$RUNNER_TEMP/pg-tools/psql"
          chmod +x "$RUNNER_TEMP/pg-tools/pg_dump" "$RUNNER_TEMP/pg-tools/psql"
          echo "$RUNNER_TEMP/pg-tools" >> "$GITHUB_PATH"

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full test suite
        run: composer test
