name: tests

on:
  push:
    branches: [main]
    # Release Please commits only touch these files and were tested on the release PR.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - LICENSE
      - version.txt
      - .release-please-manifest.json
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [ci, full, acceptance]
        default: full
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false)

    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: app_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d app_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app
      DB_TEST_DATABASE: app_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_URL: ''

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      # Browser lifecycle tests provide their own WebSocket implementation.
      VITE_BROADCAST_CONNECTION: reverb
      VITE_REVERB_APP_KEY: browser-key
      VITE_REVERB_HOST: 127.0.0.1
      VITE_REVERB_PORT: '8080'
      VITE_REVERB_SCHEME: http
      BACKUP_INTEGRATION: '1'
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run test suite
        uses: ./.github/actions/test-suite
        with:
          suite: ${{ inputs.suite || 'ci' }}
          postgres-container: ${{ job.services.postgres.id }}
