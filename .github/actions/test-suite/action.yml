name: Test suite
description: Run the shared CI, full, or acceptance test suite
inputs:
  suite:
    description: Requested suite for manual dispatch
    required: true
  postgres-container:
    description: PostgreSQL service container ID
    required: true
runs:
  using: composite
  steps:
    - name: Test CI scope detection
      shell: bash
      run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

    - name: Detect change scope
      id: scope
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        REPOSITORY: ${{ github.repository }}
        REQUESTED_SUITE: ${{ inputs.suite }}
      shell: bash
      run: |
        set -euo pipefail

        mode=ci

        if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
          case "$REQUESTED_SUITE" in
            ci|full|acceptance) mode="$REQUESTED_SUITE" ;;
            *) echo 'Unsupported test suite' >&2; exit 1 ;;
          esac
        fi

        if [ -n "${PR_NUMBER:-}" ]; then
          if gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/pr-files.json"; then
            mode="$(python3 -B .github/scripts/ci_scope.py "$PR_CHANGED_FILES" < "$RUNNER_TEMP/pr-files.json")"
          fi
        fi

        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "Change scope: $mode" >> "$GITHUB_STEP_SUMMARY"

    - name: Setup PHP
      if: steps.scope.outputs.mode != 'docs'
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.5'
        extensions: mbstring, pdo_pgsql, pgsql, zip
        tools: composer:v2
        coverage: pcov
        ini-values: pcov.directory=app, pcov.enabled=0

    - name: Setup Node.js and pnpm
      if: steps.scope.outputs.mode != 'docs'
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
      with:
        version: 12.16.1
        runtime: node@26
        cache: true
        require-lockfile: true

    - name: Get Composer cache directory
      if: steps.scope.outputs.mode != 'docs'
      id: composer-cache
      shell: bash
      run: |
        echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer
      if: steps.scope.outputs.mode != 'docs'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php85-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php85-composer-

    - name: Install PHP dependencies
      if: steps.scope.outputs.mode != 'docs'
      shell: bash
      run: |
        composer install \
          --no-interaction \
          --prefer-dist \
          --no-progress

    - name: Prepare PostgreSQL backup tools
      if: steps.scope.outputs.mode != 'docs'
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres-container }}
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/pg-tools"
        printf '#!/bin/sh\nexec docker exec -i -e PGDATABASE %s pg_dump "$@"\n' "$POSTGRES_CONTAINER" > "$RUNNER_TEMP/pg-tools/pg_dump"
        printf '#!/bin/sh\nexec docker exec -i -e PGPASSWORD -e PGSSLMODE %s psql "$@"\n' "$POSTGRES_CONTAINER" > "$RUNNER_TEMP/pg-tools/psql"
        chmod +x "$RUNNER_TEMP/pg-tools/pg_dump" "$RUNNER_TEMP/pg-tools/psql"
        echo "$RUNNER_TEMP/pg-tools" >> "$GITHUB_PATH"

    - name: Prepare Laravel
      if: steps.scope.outputs.mode != 'docs'
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan migrate --force

    - name: Resolve Playwright version
      if: steps.scope.outputs.mode == 'ci' || steps.scope.outputs.mode == 'full'
      id: playwright
      shell: bash
      run: |
        node -p "'version=' + require('playwright/package.json').version" >> "$GITHUB_OUTPUT"
        # Runner image variables need exporting to the Actions env context for cache keys.
        printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:?}" "${ImageVersion:?}" >> "$GITHUB_ENV"

    - name: Cache Playwright browsers
      if: steps.scope.outputs.mode == 'ci' || steps.scope.outputs.mode == 'full'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-shell-${{ steps.playwright.outputs.version }}

    - name: Cache Playwright system packages
      if: steps.scope.outputs.mode == 'ci' || steps.scope.outputs.mode == 'full'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/playwright-apt
        key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-playwright-apt-${{ steps.playwright.outputs.version }}

    - name: Prepare Playwright system package cache
      if: steps.scope.outputs.mode == 'ci' || steps.scope.outputs.mode == 'full'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/playwright-apt"
        # docker-clean deletes archives after apt runs, even when retention is enabled.
        if [ -f /etc/apt/apt.conf.d/docker-clean ]; then
          sudo rm /etc/apt/apt.conf.d/docker-clean
        fi
        sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null <<'APT'
        APT::Keep-Downloaded-Packages "true";
        Binary::apt::APT::Keep-Downloaded-Packages "true";
        Acquire::Retries "3";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        APT
        sudo mkdir -p /var/cache/apt/archives
        find "$RUNNER_TEMP/playwright-apt" -maxdepth 1 -type f -name '*.deb' \
          -exec sudo cp -t /var/cache/apt/archives/ -- {} +
        echo "Restored $(find "$RUNNER_TEMP/playwright-apt" -maxdepth 1 -type f -name '*.deb' | wc -l) cached packages"
        apt-config dump | grep -E 'Keep-Downloaded-Packages|Acquire::(Retries|http::Timeout|https::Timeout)'

    - name: Install browser dependencies
      if: steps.scope.outputs.mode == 'ci' || steps.scope.outputs.mode == 'full'
      shell: bash
      run: pnpm exec playwright install --with-deps --only-shell chromium

    - name: Collect Playwright system packages
      if: steps.scope.outputs.mode == 'ci' || steps.scope.outputs.mode == 'full'
      shell: bash
      run: |
        set -euo pipefail
        find /var/cache/apt/archives -maxdepth 1 -type f -name '*.deb' \
          -exec cp -t "$RUNNER_TEMP/playwright-apt/" -- {} +
        echo "Cached $(find "$RUNNER_TEMP/playwright-apt" -maxdepth 1 -type f -name '*.deb' | wc -l) packages"
        du -sh "$RUNNER_TEMP/playwright-apt"

    - name: Run selected test suite
      if: steps.scope.outputs.mode != 'docs'
      env:
        TEST_SUITE: ${{ steps.scope.outputs.mode }}
      shell: bash
      run: |
        case "$TEST_SUITE" in
          ci) composer test:ci ;;
          full) composer test ;;
          acceptance) composer test:feature-build ;;
          *) echo 'Unsupported test suite' >&2; exit 1 ;;
        esac

    - name: Summarize test timings
      if: always() && steps.scope.outputs.mode != 'docs'
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        import xml.etree.ElementTree as ET

        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('\n### Test timings\n\n')
            for path in sorted(Path('storage/framework/testing').glob('*.xml')):
                root = ET.parse(path).getroot()
                cases = list(root.iter('testcase'))
                summary.write(f'\n**{path.stem}**: {len(cases)} tests\n\n')
                summary.write('| Slowest tests | Seconds |\n| --- | ---: |\n')
                for case in sorted(cases, key=lambda case: float(case.get('time', '0')), reverse=True)[:10]:
                    name = f"{case.get('class', '')}: {case.get('name', '')}".replace('|', '\\|').replace('\n', ' ')
                    summary.write(f"| {name} | {float(case.get('time', '0')):.2f} |\n")
        PY

    - name: Confirm documentation-only change
      if: steps.scope.outputs.mode == 'docs'
      shell: bash
      run: echo "Only documentation files changed; the test suite was skipped." >> "$GITHUB_STEP_SUMMARY"
